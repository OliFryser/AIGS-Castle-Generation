mode: "interactive" # interactive | mapElites | terrainBuilder | conventionalEA
printTimer: False
castleTilesFilepath: "resources/castleTiles/"

interactive:
    castleGenerationFilepath: "resources/castleGenerationInstructions/test9.txt" # emptyKeep.txt | test4.txt
    resolution: 4
    levelFilepath: "resources/terrainMaps/mountain.txt" # bridgedRiver2.txt | mountain.txt

mapElites:
    levelFilepath: "resources/terrainMaps/bridgedRiver2.txt"
    archiveSavepath: "resources/archives/MapElites/"
    iterations: 5000
    population: 100
    resolution: 4
    useFitnessWithCost: True

terrainBuilder:
    levelFilepath: "resources/terrainMaps/mountain.txt"
    resolution: 4
    maxHeightMultiplier: 1

conventionalEA:
    levelFilepath: "resources/terrainMaps/mountain.txt"
    archiveSavepath: "resources/archives/ConventionalEA/"
    iterations: 250
    population: 20
    resolution: 4
    useFitnessWithCost: True
